name: release

# A tag vX.Y.Z (made by scripts/release/prepare.py) builds the wheel, the
# sdist and one self-contained bundle per platform, installs each bundle the
# way users do (scripts/release/smoke.sh), and creates a DRAFT GitHub release
# with the assets and SHA256SUMS. A maintainer reviews the draft and
# publishes it; only then does `releases/latest` (and so
# `curl -fsSL https://ozagia.com/install | bash`) pick it up. See docs/release.md.
#
# A push to a release/** branch, or a manual run (workflow_dispatch), builds
# and smoke-tests without making a release.

on:
  push:
    tags: ["v*"]
    # Release branches build and smoke-test every bundle; no release is made.
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Test
        run: .venv/bin/python -m pytest -q

  dist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version $version" >&2
            exit 1
          fi
      - name: Build wheel and sdist
        run: uv build --wheel --sdist -o dist .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  bundle:
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build bundle
        run: |
          python scripts/release/build_bundle.py --target ${{ matrix.target }} \
            --wheel dist/ozagia-${{ needs.dist.outputs.version }}-py3-none-any.whl \
            --out bundles
      - name: Smoke test (install, self check with the TUI, index, uninstall)
        run: scripts/release/smoke.sh bundles/ozagia-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: bundles/ozagia-${{ matrix.target }}.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: [test, dist, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir release
          cp artifacts/dist/* artifacts/bundle-*/*.tar.gz release/
          cp install release/install
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        run: python3 scripts/release/notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --draft --title "ozagia ${GITHUB_REF_NAME}" --notes-file notes.md \
            $(case "${GITHUB_REF_NAME}" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) echo --prerelease ;; esac)
