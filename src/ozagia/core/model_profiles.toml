# Curated, approximate model profiles for `ozagia.core.model_graph`.
#
# These are *not* authoritative provider metadata. They are a small,
# human-curated reference used to place a discovered model id on a graph when
# `opencode models` reports only the id. Every number is approximate and may be
# stale; a missing value is deliberately left out instead of guessed.
#
# Rules:
# - `match` entries are fnmatch patterns against the lower-case model name
#   (the part after the provider, including any `/`).
# - The first matching profile wins, so specific variants come before the
#   generic family entry.
# - `params_total_b` / `params_active_b` are only present for open-weight
#   models whose size is public. Closed models keep them unset and use
#   `size_class` instead.
# - `context` is tokens. Costs are USD per million tokens. Omit both when the
#   value is version-dependent or not public.
# - A repository override in `[model_graph.models."provider/model"]` always
#   wins over these profiles.

schema = 1

