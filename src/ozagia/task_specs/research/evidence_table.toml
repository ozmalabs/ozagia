id = "evidence_table"
version = 1
title = "Evidence table"
objective = "Build an evidence table for a claim with source locators and support, contradiction or neutral relations, then write it under history/."
inputs = ["claim", "source_paths"]
tools = ["read", "grep", "write"]
write_scope = ["history"]
requires_graph = false
stop = ["gate_failed", "budget_exhausted", "resource_limit", "no_progress", "repeated_state"]
output = "evidence_table.v1"

[worktree]
base = "main"
require_clean = false
require_up_to_date = false

[resources]
memory_mb = 1024
disk_mb = 1024
pids = 64
wall_s = 240

[budget]
tokens = 20000
model_calls = 0
cost_usd = 0.0
wall_s = 240

[gates]
before = ["resources_fit"]
after = ["schema_valid", "evidence_present"]

[approval]
mutate = "ask"
network = "deny"

[output_schema]
type = "object"
required = ["claim", "rows", "table_path", "not_assessed"]
additionalProperties = false

[output_schema.properties.claim]
type = "string"
minLength = 1

[output_schema.properties.rows]
type = "array"

[output_schema.properties.rows.items]
type = "object"
required = ["evidence", "locator", "relation"]
additionalProperties = false

[output_schema.properties.rows.items.properties.evidence]
type = "string"
minLength = 1

[output_schema.properties.rows.items.properties.locator]
type = "string"
minLength = 1

[output_schema.properties.rows.items.properties.relation]
type = "string"
enum = ["supports", "contradicts", "neutral"]

[output_schema.properties.table_path]
type = "string"
minLength = 1

[output_schema.properties.not_assessed]
type = "array"

[output_schema.properties.not_assessed.items]
type = "string"

[[steps]]
id = "find-evidence"
tool = "grep"
goal = "Find passages relevant to the claim and record their locators."
paths = ["."]

[steps.budget]
tokens = 8000

[[steps]]
id = "read-sources"
tool = "read"
goal = "Read the matching passages and classify each relation."
paths = ["."]

[steps.budget]
tokens = 6000

[[steps]]
id = "write-table"
tool = "write"
goal = "Write the evidence table under history/evidence/."
paths = ["."]
write_paths = ["history/evidence"]

[steps.budget]
tokens = 4000
