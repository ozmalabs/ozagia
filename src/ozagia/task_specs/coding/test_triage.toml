id = "test_triage"
version = 1
title = "Test triage"
objective = "Turn a failing-test log into a cause hypothesis, the covering tests and a bounded proposed fix."
inputs = ["failure_log"]
tools = ["read", "grep", "test"]
write_scope = []
requires_graph = false
stop = ["gate_failed", "budget_exhausted", "resource_limit", "no_progress", "repeated_state"]
output = "test_triage.v1"

[worktree]
base = "main"
require_clean = false
require_up_to_date = false

[resources]
memory_mb = 1024
disk_mb = 512
pids = 64
wall_s = 300

[budget]
tokens = 24000
model_calls = 0
cost_usd = 0.0
wall_s = 300

[gates]
before = ["resources_fit"]
after = ["schema_valid", "evidence_present"]

[approval]
mutate = "deny"
network = "deny"

[output_schema]
type = "object"
required = ["failing_tests", "covering_tests", "proposed_fix", "not_assessed"]
additionalProperties = false

[output_schema.properties.failing_tests]
type = "array"

[output_schema.properties.failing_tests.items]
type = "object"
required = ["test", "cause", "locator"]
additionalProperties = false

[output_schema.properties.failing_tests.items.properties.test]
type = "string"
minLength = 1

[output_schema.properties.failing_tests.items.properties.cause]
type = "string"
minLength = 1

[output_schema.properties.failing_tests.items.properties.locator]
type = "string"
minLength = 1

[output_schema.properties.covering_tests]
type = "array"

[output_schema.properties.covering_tests.items]
type = "string"

[output_schema.properties.proposed_fix]
type = "string"

[output_schema.properties.not_assessed]
type = "array"

[output_schema.properties.not_assessed.items]
type = "string"

[[steps]]
id = "read-failure"
tool = "read"
goal = "Read the failure log and extract failing test ids and error messages."
paths = ["."]

[steps.budget]
tokens = 8000

[[steps]]
id = "reproduce"
tool = "test"
goal = "Reproduce the failing test through the supplied test adapter."
paths = ["."]

[steps.budget]
tokens = 8000

[[steps]]
id = "find-covering"
tool = "grep"
goal = "Find the covering tests and the code path that raised the error."
paths = ["."]

[steps.budget]
tokens = 6000

[[steps]]
id = "assemble"
tool = "read"
goal = "Assemble causes, covering tests, a proposed fix and omissions."
paths = ["."]

[steps.budget]
tokens = 2000
