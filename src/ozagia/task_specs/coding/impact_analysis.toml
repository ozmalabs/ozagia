id = "impact_analysis"
version = 1
title = "Impact analysis"
objective = "Map changed files to graph keys, their dependents and covering tests, with a bounded risk rating."
inputs = ["diff"]
tools = ["grep", "graph_search", "read"]
write_scope = []
requires_graph = true
stop = ["gate_failed", "budget_exhausted", "resource_limit", "no_progress", "repeated_state"]
output = "impact_report.v1"

[worktree]
base = "main"
require_clean = false
require_up_to_date = false

[resources]
memory_mb = 1024
disk_mb = 512
pids = 64
wall_s = 240

[budget]
tokens = 30000
model_calls = 0
cost_usd = 0.0
wall_s = 240

[gates]
before = ["worktree_expected", "branch_expected", "resources_fit", "snapshot_fresh"]
after = ["schema_valid", "evidence_present"]

[approval]
mutate = "deny"
network = "deny"

[output_schema]
type = "object"
required = ["changed_keys", "dependents", "covering_tests", "risk", "not_assessed"]
additionalProperties = false

[output_schema.properties.changed_keys]
type = "array"

[output_schema.properties.changed_keys.items]
type = "string"

[output_schema.properties.dependents]
type = "array"

[output_schema.properties.dependents.items]
type = "object"
required = ["key", "distance", "kind"]
additionalProperties = false

[output_schema.properties.dependents.items.properties.key]
type = "string"
minLength = 1

[output_schema.properties.dependents.items.properties.distance]
type = "integer"
minimum = 0

[output_schema.properties.dependents.items.properties.kind]
type = "string"
minLength = 1

[output_schema.properties.covering_tests]
type = "array"

[output_schema.properties.covering_tests.items]
type = "string"

[output_schema.properties.risk]
type = "string"
enum = ["low", "medium", "high"]

[output_schema.properties.not_assessed]
type = "array"

[output_schema.properties.not_assessed.items]
type = "string"

[[steps]]
id = "changed-keys"
tool = "grep"
goal = "Identify the changed files and their graph keys."
paths = ["."]

[steps.budget]
tokens = 8000

[[steps]]
id = "dependents"
tool = "graph_search"
goal = "Collect dependents and covering tests for each changed key."
paths = ["."]

[steps.budget]
tokens = 16000

[[steps]]
id = "report"
tool = "read"
goal = "Assemble the impact report, risk rating and omissions."
paths = ["."]

[steps.budget]
tokens = 6000
