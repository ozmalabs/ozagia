id = "config_validate"
version = 1
title = "Configuration validation"
objective = "Validate a repository configuration file for invalid keys, conflicting values and suggested corrections, without writing."
inputs = ["config_path"]
tools = ["read", "grep"]
write_scope = []
requires_graph = false
stop = ["gate_failed", "budget_exhausted", "resource_limit", "no_progress", "repeated_state"]
output = "config_check.v1"

[worktree]
base = "main"
require_clean = false
require_up_to_date = false

[resources]
memory_mb = 512
disk_mb = 256
pids = 32
wall_s = 120

[budget]
tokens = 12000
model_calls = 0
cost_usd = 0.0
wall_s = 120

[gates]
before = ["resources_fit"]
after = ["schema_valid", "evidence_present"]

[approval]
mutate = "deny"
network = "deny"

[output_schema]
type = "object"
required = ["ok", "invalid_keys", "conflicts", "suggestions", "not_assessed"]
additionalProperties = false

[output_schema.properties.ok]
type = "boolean"

[output_schema.properties.invalid_keys]
type = "array"

[output_schema.properties.invalid_keys.items]
type = "string"

[output_schema.properties.conflicts]
type = "array"

[output_schema.properties.conflicts.items]
type = "object"
required = ["keys", "detail"]
additionalProperties = false

[output_schema.properties.conflicts.items.properties.keys]
type = "array"

[output_schema.properties.conflicts.items.properties.keys.items]
type = "string"

[output_schema.properties.conflicts.items.properties.detail]
type = "string"
minLength = 1

[output_schema.properties.suggestions]
type = "array"

[output_schema.properties.suggestions.items]
type = "object"
required = ["key", "suggested_value", "reason"]
additionalProperties = false

[output_schema.properties.suggestions.items.properties.key]
type = "string"
minLength = 1

[output_schema.properties.suggestions.items.properties.suggested_value]
type = "string"

[output_schema.properties.suggestions.items.properties.reason]
type = "string"
minLength = 1

[output_schema.properties.not_assessed]
type = "array"

[output_schema.properties.not_assessed.items]
type = "string"

[[steps]]
id = "read-config"
tool = "read"
goal = "Read the configuration file and list its sections and keys."
paths = ["."]

[steps.budget]
tokens = 5000

[[steps]]
id = "find-references"
tool = "grep"
goal = "Find keys that conflict with the settings registry or another file."
paths = ["."]

[steps.budget]
tokens = 4000

[[steps]]
id = "report"
tool = "read"
goal = "Assemble invalid keys, conflicts, suggestions and omissions."
paths = ["."]

[steps.budget]
tokens = 3000
