id = "log_inspect"
version = 1
title = "Log inspection"
objective = "Cluster failures in a local log, attach evidence lines and propose a bounded fix for each cluster."
inputs = ["log_path"]
tools = ["read", "grep"]
write_scope = []
requires_graph = false
stop = ["gate_failed", "budget_exhausted", "resource_limit", "no_progress", "repeated_state"]
output = "failure_clusters.v1"

[worktree]
base = "main"
require_clean = false
require_up_to_date = false

[resources]
memory_mb = 1024
disk_mb = 512
pids = 64
wall_s = 300

[budget]
tokens = 30000
model_calls = 0
cost_usd = 0.0
wall_s = 300

[gates]
before = ["resources_fit"]
after = ["schema_valid", "evidence_present"]

[approval]
mutate = "deny"
network = "deny"

[output_schema]
type = "object"
required = ["clusters", "redactions", "not_assessed"]
additionalProperties = false

[output_schema.properties.clusters]
type = "array"

[output_schema.properties.clusters.items]
type = "object"
required = ["signature", "count", "evidence", "proposed_fix"]
additionalProperties = false

[output_schema.properties.clusters.items.properties.signature]
type = "string"
minLength = 1

[output_schema.properties.clusters.items.properties.count]
type = "integer"
minimum = 1

[output_schema.properties.clusters.items.properties.evidence]
type = "string"
minLength = 1

[output_schema.properties.clusters.items.properties.proposed_fix]
type = "string"
minLength = 1

[output_schema.properties.redactions]
type = "array"

[output_schema.properties.redactions.items]
type = "string"

[output_schema.properties.not_assessed]
type = "array"

[output_schema.properties.not_assessed.items]
type = "string"

[[steps]]
id = "read-log"
tool = "read"
goal = "Read the local log and identify its format and time range."
paths = ["."]

[steps.budget]
tokens = 8000

[[steps]]
id = "cluster"
tool = "grep"
goal = "Group repeated failures by signature and count their occurrences."
paths = ["."]

[steps.budget]
tokens = 16000

[[steps]]
id = "report"
tool = "read"
goal = "Assemble clusters, redactions, proposed fixes and omissions."
paths = ["."]

[steps.budget]
tokens = 6000
