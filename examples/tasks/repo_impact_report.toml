id = "repo_impact"
version = 1
title = "Repository impact report"
objective = "Map changed files to graph keys, dependents and covering tests, then write a Markdown report under history/."
inputs = ["diff", "repo_root"]
tools = ["grep", "graph_search", "write"]
write_scope = ["history"]
requires_graph = true
stop = ["gate_failed", "budget_exhausted", "resource_limit", "no_progress", "repeated_state"]
output = "impact_report.v1"

[worktree]
base = "main"
require_clean = false
require_up_to_date = false

[resources]
memory_mb = 1024
disk_mb = 1024
pids = 64
wall_s = 240

[budget]
tokens = 30000
model_calls = 0
cost_usd = 0.0
wall_s = 240

[gates]
before = ["worktree_expected", "branch_expected", "resources_fit", "snapshot_fresh"]
after = ["schema_valid", "evidence_present"]

[approval]
mutate = "ask"
network = "deny"

[output_schema]
type = "object"
required = ["summary", "report_path", "dependents"]
additionalProperties = false

[output_schema.properties.summary]
type = "string"
minLength = 1

[output_schema.properties.report_path]
type = "string"
minLength = 1

[output_schema.properties.dependents]
type = "array"

[output_schema.properties.dependents.items]
type = "string"

[[steps]]
id = "changed-keys"
tool = "grep"
goal = "Identify changed files and their graph keys."
paths = ["."]

[steps.budget]
tokens = 8000

[[steps]]
id = "dependents"
tool = "graph_search"
goal = "Collect dependents and covering tests for each changed key."
paths = ["."]

[steps.budget]
tokens = 10000

[[steps]]
id = "write-report"
tool = "write"
goal = "Write the impact report under history/."
paths = ["."]
write_paths = ["history"]

[steps.budget]
tokens = 6000
